<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>跳绳计数器</title>
  <style>
    :root { --canvas:#f5f5f7; --surface:#fff; --ink:#1d1d1f; --secondary:#6e6e73; --line:#d2d2d7; --blue:#0071e3; --blue-hover:#0077ed; --green:#34c759; --soft:#f2f2f7; --shadow:0 12px 34px rgba(0,0,0,.06); }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; color:var(--ink); background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    button,input,select { font:inherit; } button { cursor:pointer; } button:disabled { cursor:not-allowed; opacity:.45; }
    .shell { width:min(1060px,calc(100% - 40px)); margin:0 auto; padding:22px 0 42px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; height:38px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:650; letter-spacing:-.02em; }
    .brand-mark { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:#fff; background:var(--ink); font-size:15px; }
    .header-actions { display:flex; align-items:center; gap:14px; }
    .local-chip { display:inline-flex; align-items:center; gap:6px; color:var(--secondary); font-size:12px; }
    .local-chip i { width:7px; height:7px; border-radius:50%; background:var(--green); }
    .repo-links { display:flex; align-items:center; gap:9px; }
    .repo-links a { color:var(--secondary); font-size:12px; text-decoration:none; transition:color .15s ease,border-color .15s ease,background .15s ease; }
    .repo-links a:hover { color:var(--ink); }
    .repo-links .star-link { padding:5px 8px; border:1px solid var(--line); border-radius:999px; color:var(--ink); background:rgba(255,255,255,.58); }
    .repo-links .star-link:hover { border-color:#aaa; background:#fff; }
    .intro { padding:54px 0 26px; }
    .intro h1 { margin:0; font-size:clamp(32px,5vw,52px); line-height:1.08; letter-spacing:-.055em; font-weight:700; }
    .intro p { margin:12px 0 0; color:var(--secondary); font-size:16px; line-height:1.5; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr); align-items:start; gap:18px; }
    .panel { min-width:0; padding:22px; border:1px solid rgba(0,0,0,.05); border-radius:18px; background:var(--surface); box-shadow:var(--shadow); }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    h2 { margin:0; font-size:16px; line-height:1.2; letter-spacing:-.02em; }
    .panel-label,.record-summary { color:var(--secondary); font-size:12px; }
    .dropzone { display:block; padding:16px 17px; border:1px dashed #b8b8bd; border-radius:12px; color:var(--secondary); background:#fbfbfd; cursor:pointer; transition:.18s ease; }
    .dropzone:hover,.dropzone.drag { border-color:var(--blue); background:#f0f7ff; }
    .dropzone strong { display:block; color:var(--ink); font-size:14px; font-weight:600; }
    .dropzone span { display:block; margin-top:4px; font-size:12px; }
    input[type=file] { display:none; }
    .video-stage { aspect-ratio:16/9; margin-top:14px; display:grid; place-items:center; overflow:hidden; border-radius:13px; background:#f2f2f7; position:relative; }
    .video-stage.has-video { background:#111; }
    video { display:block; width:100%; height:100%; max-height:540px; object-fit:contain; background:#111; }
    .empty-stage { display:grid; place-items:center; gap:10px; color:var(--secondary); font-size:13px; }
    .empty-stage b { display:grid; place-items:center; width:42px; height:42px; border-radius:12px; color:var(--secondary); background:#e5e5ea; font-size:20px; font-weight:500; }
    .control-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .btn { min-height:40px; padding:0 15px; border:1px solid transparent; border-radius:9px; color:#fff; background:var(--blue); font-size:13px; font-weight:600; transition:background .15s ease,transform .15s ease; }
    .btn:hover:not(:disabled) { background:var(--blue-hover); transform:translateY(-1px); }
    .btn.secondary { color:var(--ink); border-color:var(--line); background:#fff; }
    .btn.secondary:hover:not(:disabled) { background:var(--soft); }
    .btn.ghost { color:var(--secondary); background:transparent; border-color:transparent; }
    .status-row { display:flex; align-items:center; gap:8px; margin-top:13px; color:var(--secondary); font-size:12px; }
    .status-row #status { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .progress-wrap { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--secondary); font-size:11px; }
    .progress { flex:1; height:4px; overflow:hidden; border-radius:999px; background:#e5e5ea; }
    .progress i { display:block; width:0; height:100%; border-radius:inherit; background:var(--blue); transition:width .2s; }
    .live-banner { display:flex; align-items:center; gap:8px; margin-top:12px; padding:9px 11px; border-radius:9px; color:#087b5b; background:#e6f7ed; font-size:12px; }
    .live-banner i { width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity:.35; transform:scale(.75); } }
    .result-panel { display:flex; flex-direction:column; align-self:start; }
    .result-state { display:inline-flex; align-items:center; padding:5px 8px; border-radius:999px; color:var(--secondary); background:var(--soft); font-size:11px; }
    .result-state[data-tone="live"] { color:#087b5b; background:#e6f7ed; }
    .result-state[data-tone="done"] { color:#8a5d13; background:#fff2d7; }
    .result-number { display:flex; align-items:baseline; gap:8px; padding:23px 0 13px; border-bottom:1px solid var(--line); }
    .result-number strong { font-size:clamp(78px,10vw,116px); line-height:.86; letter-spacing:-.09em; font-variant-numeric:tabular-nums; }
    .result-number span { color:var(--secondary); font-size:18px; }
    .result-sub { min-height:0; padding-top:12px; color:var(--secondary); font-size:12px; line-height:1.6; }
    .adjust { display:flex; align-items:center; gap:9px; margin-top:17px; padding-top:0; }
    .adjust button { width:38px; height:36px; padding:0; border:1px solid var(--line); border-radius:9px; color:var(--ink); background:#fff; font-size:20px; }
    .adjust button:hover:not(:disabled) { background:var(--soft); }
    .adjust output { min-width:42px; text-align:center; font-size:15px; font-variant-numeric:tabular-nums; }
    .result-actions { display:flex; gap:8px; margin-top:12px; }
    .result-actions .btn { width:100%; }
    .daily-panel { margin-top:18px; padding:19px 22px; }
    .daily-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .daily-head h2 { display:flex; align-items:baseline; gap:9px; }
    .month-summary { color:var(--secondary); font-size:11px; font-weight:400; letter-spacing:0; }
    .month-nav { display:flex; align-items:center; gap:10px; }
    .month-nav strong { min-width:72px; text-align:center; font-size:13px; font-variant-numeric:tabular-nums; }
    .month-nav button { display:grid; place-items:center; width:30px; height:30px; padding:0; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:#fff; font-size:16px; }
    .month-nav button:hover:not(:disabled) { background:var(--soft); }
    .weekdays,.calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }
    .weekdays { margin-bottom:5px; color:#98989d; text-align:center; font-size:10px; }
    .calendar-day,.calendar-blank { min-width:0; min-height:51px; }
    .calendar-day { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px 2px; border:1px solid transparent; border-radius:9px; color:var(--ink); background:transparent; }
    .calendar-day:hover { background:var(--soft); }
    .calendar-day.selected { border-color:#b8d7fa; background:#edf6ff; }
    .calendar-day.today .day-number { color:var(--blue); font-weight:700; }
    .calendar-day .day-number { font-size:12px; line-height:1; font-variant-numeric:tabular-nums; }
    .calendar-day .day-count { min-height:11px; color:var(--secondary); font-size:9px; line-height:1; font-variant-numeric:tabular-nums; }
    .calendar-day.has-records .day-count { color:var(--blue); font-weight:600; }
    .daily-detail { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:13px; padding-top:12px; border-top:1px solid var(--line); }
    .day-summary { display:flex; align-items:baseline; gap:8px; min-width:0; }
    .day-summary strong { font-size:13px; white-space:nowrap; }
    .day-summary span { overflow:hidden; color:var(--secondary); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .day-records { display:grid; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); gap:6px; margin-top:10px; }
    .day-record { display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; min-width:0; padding:8px 10px; border-radius:9px; background:#f7f7f9; }
    .day-record-info { min-width:0; }
    .day-record-count { font-size:13px; font-weight:650; font-variant-numeric:tabular-nums; }
    .day-record-meta { margin-top:2px; color:var(--secondary); font-size:10px; }
    .delete-record { width:26px; height:26px; border:0; border-radius:7px; color:#8e8e93; background:transparent; font-size:17px; }
    .delete-record:hover { color:#c93434; background:#fff; }
    .daily-empty { grid-column:1/-1; padding:6px 0 1px; color:var(--secondary); font-size:11px; }
    .method-peek { position:relative; }
    .method-peek summary { list-style:none; cursor:pointer; }
    .method-peek summary::-webkit-details-marker { display:none; }
    .method-popover { position:absolute; top:37px; left:0; z-index:10; width:250px; padding:13px 14px; border:1px solid rgba(0,0,0,.07); border-radius:12px; background:rgba(255,255,255,.98); box-shadow:0 12px 30px rgba(0,0,0,.12); }
    .method-popover strong { display:block; font-size:12px; }
    .method-popover p { margin:6px 0 0; color:var(--secondary); font-size:11px; line-height:1.55; }
    footer { margin-top:20px; color:#98989d; text-align:center; font-size:11px; }
    @media (max-width:820px) { .intro { padding-top:38px; } .workspace { grid-template-columns:1fr; } .result-panel { min-height:0; } .adjust { margin-top:14px; } }
    @media (max-width:520px) { .shell { width:min(100% - 24px,1060px); padding-top:14px; } .topbar { gap:8px; } .header-actions { gap:7px; } .repo-links { gap:5px; } .repo-links .star-link { padding:4px 7px; } .local-chip { font-size:10px; } .intro { padding:34px 0 20px; } .intro h1 { font-size:34px; } .panel { padding:17px; border-radius:15px; } .control-row .btn { flex:1 1 46%; } .daily-panel { padding:15px 13px; } .weekdays,.calendar-grid { gap:2px; } .calendar-day,.calendar-blank { min-height:44px; } .calendar-day { border-radius:7px; } .calendar-day .day-count { font-size:8px; } .daily-detail { align-items:flex-start; flex-direction:column; gap:2px; } .day-records { grid-template-columns:1fr; } .method-popover { width:220px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><details class="method-peek"><summary class="brand-mark" aria-label="查看计数原理" title="查看计数原理">↗</summary><div class="method-popover"><strong>计数原理</strong><p>识别双髋和双脚的上下运动；当上升、下降的幅度与间隔都达标，就记为 1 下。</p></div></details><div>跳绳计数器</div></div><div class="header-actions"><div class="local-chip"><i></i> 仅在本机处理</div><nav class="repo-links" aria-label="项目链接"><a href="https://github.com/Mentran/jump-rope-counter" target="_blank" rel="noreferrer">GitHub ↗</a><a class="star-link" href="https://github.com/Mentran/jump-rope-counter" target="_blank" rel="noreferrer" aria-label="在 GitHub 上为项目点 Star">★ <span id="starCount">Star</span></a></nav></div></header>
    <section class="intro"><h1>上传视频，开始计数</h1><p>选择一种方式，数清每一次跳跃。</p></section>
    <main>
      <div class="workspace">
        <section class="panel">
          <div class="panel-head"><h2>视频</h2><span class="panel-label" id="videoState">未载入视频</span></div>
          <label class="dropzone" id="drop" for="file"><strong>选择视频或拖到这里</strong><span>MP4 / MOV / WebM · 建议全身入镜</span><input id="file" type="file" accept="video/*" /></label>
          <div class="video-stage" id="videoStage"><video id="video" controls playsinline hidden></video><div class="empty-stage" id="emptyStage"><b>↗</b><span>还没有选择视频</span></div></div>
          <div class="control-row"><button class="btn" id="analyze" disabled>视频分析</button><button class="btn secondary" id="realtime" disabled>实时播放</button><button class="btn secondary" id="camera">摄像头</button><button class="btn ghost" id="clear">清空</button></div>
          <div class="status-row"><span id="status">等待上传视频</span></div>
          <div class="progress-wrap"><div class="progress"><i id="progress"></i></div><span id="progressText">0%</span></div>
          <div class="live-banner" id="liveBanner" hidden><i></i><span>实时识别中 · 每确认一次起跳，计数增加 1</span></div>
        </section>
        <section class="panel result-panel">
          <div class="panel-head"><h2>计数</h2><span class="result-state" id="resultState">未开始</span></div>
          <div class="result-number"><strong id="count">—</strong><span>下</span></div>
          <div class="result-sub" id="resultSub">选择一种计数方式开始。</div>
          <div class="adjust"><button id="minus" disabled>−</button><output id="adjusted">—</output><button id="plus" disabled>＋</button><span class="panel-label">手动校正</span></div>
          <div class="result-actions"><button class="btn" id="save" disabled>保存结果</button></div>
        </section>
      </div>
      <section class="panel daily-panel" aria-labelledby="dailyTitle">
        <div class="daily-head">
          <h2 id="dailyTitle">每日打卡 <span class="month-summary" id="monthSummary"></span></h2>
          <div class="month-nav"><button id="prevMonth" type="button" aria-label="上个月">‹</button><strong id="monthLabel"></strong><button id="nextMonth" type="button" aria-label="下个月">›</button></div>
        </div>
        <div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="每日跳绳记录"></div>
        <div class="daily-detail">
          <div class="day-summary"><strong id="selectedDateLabel"></strong><span id="daySummary"></span></div>
        </div>
        <div class="day-records" id="dayRecords"></div>
      </section>
    </main>
    <footer>本地处理 · 结果保存在当前设备</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const fileInput=$('file'), drop=$('drop'), video=$('video'), videoStage=$('videoStage'), emptyStage=$('emptyStage');
    const analyze=$('analyze'), realtime=$('realtime'), camera=$('camera'), clear=$('clear'), save=$('save');
    const statusEl=$('status'), videoState=$('videoState'), resultState=$('resultState'), resultSub=$('resultSub');
    const progress=$('progress'), progressText=$('progressText'), liveBanner=$('liveBanner');
    const countEl=$('count'), adjustedEl=$('adjusted'), plus=$('plus'), minus=$('minus');
    const monthLabel=$('monthLabel'), monthSummary=$('monthSummary'), calendarGrid=$('calendarGrid');
    const selectedDateLabel=$('selectedDateLabel'), daySummary=$('daySummary'), dayRecords=$('dayRecords');
    const storageKey='jump-counter-records-v4', legacyStorageKey='jump-counter-records-v3';
    const defaultCountConfig={threshold:.10,minGap:.20};
    const today=new Date();
    let objectUrl=null, detector=null, currentFile=null, currentVideoKey=null, currentResult=null;
    let detectedCount=null, adjustedCount=null, cameraStream=null, liveRunning=false, liveMethod='实时播放';
    let liveRaf=0, liveBusy=false, liveLastFrame=0, liveSamples=[], liveSignal=[], liveEvents=[];
    let liveCount=0, liveLastEventTime=-Infinity, livePhase=0, livePrevY=NaN, livePrevT=NaN;
    let liveCycleStartY=NaN, liveTroughY=NaN, liveMaxY=NaN;
    let selectedDate=localDateKey(today), visibleMonth=new Date(today.getFullYear(),today.getMonth(),1);
    let records=loadRecords();

    function makeId() { return crypto.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}`; }
    function localDateKey(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
    function dateForKey(key) { const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d); }
    function recordDateKey(record) { const date=new Date(record.createdAt); return Number.isNaN(date.getTime())?'':localDateKey(date); }
    function mapMethod(value) { const method=String(value||'视频分析'); if(method.includes('摄像头'))return '摄像头'; if(method.includes('实时'))return '实时播放'; return '视频分析'; }
    function normalizeRecord(item,legacy=false) {
      if(!item||!Number.isFinite(Number(item.count))||!item.createdAt)return null;
      const oldVideoId=item.videoId||item.videoKey||'unknown-video';
      const isLegacyCamera=legacy&&(String(oldVideoId).includes('camera')||String(item.modeLabel||'').includes('摄像头'));
      const videoId=isLegacyCamera?`camera:${item.id||makeId()}`:String(oldVideoId);
      const date=new Date(item.createdAt);
      if(Number.isNaN(date.getTime()))return null;
      return {videoId,createdAt:date.toISOString(),method:mapMethod(item.method||item.modeLabel),count:Math.max(0,Math.round(Number(item.count)))};
    }
    function loadRecords() {
      try {
        const modern=localStorage.getItem(storageKey), legacy=!modern&&localStorage.getItem(legacyStorageKey);
        const source=JSON.parse(modern||legacy||'[]');
        if(!Array.isArray(source))return [];
        const migrated=!modern, normalized=source.map(item=>normalizeRecord(item,migrated)).filter(Boolean), unique=new Map();
        for(const record of normalized.sort((a,b)=>a.createdAt.localeCompare(b.createdAt))) {
          const key=`${recordDateKey(record)}|${record.videoId}`;
          unique.set(key,record);
        }
        const result=[...unique.values()].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
        const expectedKeys='count,createdAt,method,videoId';
        const needsRewrite=migrated||source.some(item=>Object.keys(item||{}).sort().join(',')!==expectedKeys);
        if(needsRewrite)persistRecords(result);
        return result;
      } catch { return []; }
    }
    function persistRecords(next=records) { try { localStorage.setItem(storageKey,JSON.stringify(next)); localStorage.removeItem(legacyStorageKey); return true; } catch { return false; } }
    function setStatus(text) { statusEl.textContent=text; }
    function setProgress(value) { const n=Math.max(0,Math.min(100,value)); progress.style.width=`${n}%`; progressText.textContent=`${Math.round(n)}%`; }
    function setResultTone(text,tone='') { resultState.textContent=text; resultState.dataset.tone=tone; }
    function setCount(n) { detectedCount=Math.max(0,Math.round(n)); adjustedCount=detectedCount; countEl.textContent=detectedCount; adjustedEl.value=adjustedCount; plus.disabled=minus.disabled=false; }
    function setLiveCount(n) { if(n<liveCount)return; liveCount=n; setCount(n); }
    function keypoint(pose,name) { return pose?.keypoints?.find(k=>k.name===name&&(k.score??1)>.25); }
    function percentile(values,p) { const a=values.filter(Number.isFinite).slice().sort((x,y)=>x-y); return a.length?a[Math.min(a.length-1,Math.floor((a.length-1)*p))]:NaN; }
    function smooth(values,radius=1) { return values.map((_,i)=>{const part=values.slice(Math.max(0,i-radius),Math.min(values.length,i+radius+1)).filter(Number.isFinite);return part.length?part.reduce((a,b)=>a+b,0)/part.length:NaN;}); }
    function extractSignal(pose,height) {
      const lh=keypoint(pose,'left_hip'),rh=keypoint(pose,'right_hip');
      if(!lh||!rh)return {y:NaN,confidence:0};
      const hipY=(lh.y+rh.y)/2/height,la=keypoint(pose,'left_ankle'),ra=keypoint(pose,'right_ankle'),feetVisible=la&&ra;
      const y=feetVisible?hipY*.82+((la.y+ra.y)/2/height)*.18:hipY;
      const confidence=feetVisible?Math.min(lh.score??1,rh.score??1,la.score??1,ra.score??1):Math.min(lh.score??1,rh.score??1);
      return {y,confidence};
    }
    function findJumps(samples,fps=15) {
      const raw=samples.map(s=>s.y),valid=raw.filter(Number.isFinite);
      if(valid.length<8)return [];
      const ys=smooth(raw,1),spread=percentile(valid,.90)-percentile(valid,.10),prominence=Math.max(.004,Math.min(.025,spread*defaultCountConfig.threshold));
      const times=samples.map((s,i)=>Number.isFinite(s.t)?s.t:i/fps),candidates=[];
      for(let i=2;i<ys.length-2;i++) {
        if(!Number.isFinite(ys[i])||ys[i]>ys[i-1]||ys[i]>ys[i+1])continue;
        if(ys[i]!==Math.min(...ys.slice(i-2,i+3)))continue;
        const left=Math.max(...ys.slice(Math.max(0,i-5),i)),right=Math.max(...ys.slice(i+1,Math.min(ys.length,i+6)));
        if(Math.min(left,right)-ys[i]>=prominence)candidates.push(i);
      }
      const events=[];
      for(const i of candidates){const previous=events[events.length-1];if(!previous||times[i]-times[previous]>=defaultCountConfig.minGap)events.push(i);else if(ys[i]<ys[previous])events[events.length-1]=i;}
      return events.map(index=>({index,time:times[index]}));
    }
    function liveProminence() {
      const values=liveSignal.slice(-36).map(s=>s.y).filter(Number.isFinite);
      if(values.length<8)return .008;
      return Math.max(.006,Math.min(.022,(percentile(values,.90)-percentile(values,.10))*defaultCountConfig.threshold));
    }
    function detectLiveEvent(y,t) {
      if(!Number.isFinite(y))return null;
      if(!Number.isFinite(livePrevY)){livePrevY=y;livePrevT=t;liveMaxY=y;return null;}
      const dy=y-livePrevY,step=Math.max(.002,liveProminence()*.12);let event=null;
      if(dy < -step){if(livePhase!==-1){livePhase=-1;liveCycleStartY=Number.isFinite(liveMaxY)?liveMaxY:livePrevY;liveTroughY=y;}else liveTroughY=Math.min(liveTroughY,y);}
      else if(dy>step){
        if(livePhase===-1){const amplitude=liveCycleStartY-liveTroughY,eventTime=livePrevT;if(amplitude>=liveProminence()&&eventTime-liveLastEventTime>=defaultCountConfig.minGap){liveLastEventTime=eventTime;event={time:eventTime};}livePhase=1;liveMaxY=y;}
        else{livePhase=1;liveMaxY=Math.max(Number.isFinite(liveMaxY)?liveMaxY:y,y);}
      }else if(livePhase===1)liveMaxY=Math.max(Number.isFinite(liveMaxY)?liveMaxY:y,y);
      livePrevY=y;livePrevT=t;return event;
    }
    function updateLiveResult(){currentResult=makeResult(liveCount,liveMethod);updateResultMeta(liveMethod);}
    function resetLiveState(){liveSamples=[];liveSignal=[];liveEvents=[];liveCount=0;liveLastEventTime=-Infinity;livePhase=0;livePrevY=NaN;livePrevT=NaN;liveCycleStartY=NaN;liveTroughY=NaN;liveMaxY=NaN;liveLastFrame=0;}
    function escapeHtml(text){return String(text).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function formatCount(value){return new Intl.NumberFormat('zh-CN').format(value);}
    function formatTime(iso){return new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit'}).format(new Date(iso));}
    function formatMonth(date){return `${date.getFullYear()} 年 ${date.getMonth()+1} 月`;}
    function dateLabel(key){const date=dateForKey(key),label=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(date);return key===localDateKey(today)?`${label} · 今天`:label;}
    function renderDailyLog() {
      const year=visibleMonth.getFullYear(),month=visibleMonth.getMonth(),monthStart=new Date(year,month,1),daysInMonth=new Date(year,month+1,0).getDate();
      const prefix=`${year}-${String(month+1).padStart(2,'0')}-`,monthRecords=records.filter(r=>recordDateKey(r).startsWith(prefix)),totals=new Map();
      for(const record of monthRecords){const key=recordDateKey(record);totals.set(key,(totals.get(key)||0)+record.count);}
      monthLabel.textContent=formatMonth(visibleMonth);
      const monthTotal=[...totals.values()].reduce((sum,n)=>sum+n,0);
      monthSummary.textContent=monthRecords.length?`${totals.size} 天 · ${formatCount(monthTotal)} 下`:'本月还没有记录';
      const leading=(monthStart.getDay()+6)%7,cellCount=Math.ceil((leading+daysInMonth)/7)*7,todayKey=localDateKey(today);
      let cells='';
      for(let cell=0;cell<cellCount;cell++){
        const day=cell-leading+1;
        if(day<1||day>daysInMonth){cells+='<span class="calendar-blank" role="presentation"></span>';continue;}
        const key=`${prefix}${String(day).padStart(2,'0')}`,count=totals.get(key)||0,hasRecords=totals.has(key),selected=key===selectedDate,future=key>todayKey;
        const classes=['calendar-day',selected?'selected':'',key===todayKey?'today':'',hasRecords?'has-records':''].filter(Boolean).join(' ');
        cells+=`<button class="${classes}" type="button" role="gridcell" data-date="${key}" aria-pressed="${selected}" aria-label="${escapeHtml(dateLabel(key))}${hasRecords?`，${formatCount(count)} 下`:''}"${future?' disabled':''}><span class="day-number">${day}</span><span class="day-count">${hasRecords?(count?formatCount(count):'✓'):' '}</span></button>`;
      }
      calendarGrid.innerHTML=cells;
      const dayItems=records.filter(r=>recordDateKey(r)===selectedDate).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)),dayTotal=dayItems.reduce((sum,r)=>sum+r.count,0);
      selectedDateLabel.textContent=dateLabel(selectedDate);
      daySummary.textContent=dayItems.length?`${formatCount(dayTotal)} 下 · ${dayItems.length} 次`:'尚无记录';
      dayRecords.innerHTML=dayItems.length?dayItems.map(r=>`<article class="day-record"><div class="day-record-info"><div class="day-record-count">${formatCount(r.count)} 下</div><div class="day-record-meta">${escapeHtml(r.method)} · ${formatTime(r.createdAt)}</div></div><button class="delete-record" type="button" data-delete-record="${escapeHtml(r.videoId)}" aria-label="删除 ${formatCount(r.count)} 下记录">×</button></article>`).join(''):'<div class="daily-empty">这一天还没有保存的跳绳记录</div>';
      $('prevMonth').disabled=year<2000;
      $('nextMonth').disabled=year===today.getFullYear()&&month===today.getMonth();
    }
    async function loadGitHubStars(){try{const response=await fetch('https://api.github.com/repos/Mentran/jump-rope-counter',{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)return;const data=await response.json();if(Number.isFinite(data.stargazers_count))$('starCount').textContent=`${data.stargazers_count} Star`;}catch{}}
    function setVideoLoaded(file,key){currentFile=file;currentVideoKey=key;videoState.textContent=file.name;videoState.title=file.name;emptyStage.hidden=true;videoStage.classList.add('has-video');}
    async function fileFingerprint(file){if(!crypto?.subtle)return `${file.name}:${file.size}:${file.lastModified}`;const digest=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());return `sha256:${Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}`;}
    function resetResult(){currentResult=null;detectedCount=adjustedCount=null;countEl.textContent='—';adjustedEl.value='—';plus.disabled=minus.disabled=true;save.disabled=true;save.textContent='保存结果';setResultTone('未开始');resultSub.textContent='选择一种计数方式开始。';}
    function updateResultMeta(method){setResultTone(method,method.includes('实时')||method==='摄像头'?'live':'done');resultSub.textContent='检查次数后可手动校正，再保存到当天记录。';}
    function seekVideo(time){return new Promise(resolve=>{if(Math.abs(video.currentTime-time)<.001)return resolve();const done=()=>{video.removeEventListener('seeked',done);resolve();};video.addEventListener('seeked',done);video.currentTime=time;});}
    async function getDetector(){if(detector)return detector;setStatus('正在加载模型…');await tf.ready();detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,enableSmoothing:false});return detector;}
    function makeResult(count,method){return {count,method,videoId:currentVideoKey||'unknown-video'};}
    function saveCurrentResult(){
      if(!currentResult||adjustedCount===null)return;
      const createdAt=new Date().toISOString(),isCamera=currentResult.videoId.startsWith('camera:'),dateKey=localDateKey(new Date(createdAt));
      const existing=!isCamera&&records.find(r=>r.videoId===currentResult.videoId&&recordDateKey(r)===dateKey);
      const entry={videoId:currentResult.videoId,createdAt,method:currentResult.method,count:adjustedCount};
      const next=existing?records.map(r=>r.videoId===existing.videoId&&recordDateKey(r)===dateKey?entry:r):[...records,entry];
      if(!persistRecords(next)){setStatus('无法保存：浏览器存储空间不可用');return;}
      records=next;renderDailyLog();save.textContent=existing?'已更新今日记录':'已保存到今日';setStatus(existing?'已更新这段视频今天的记录':'记录已保存到今天');
    }
    async function analyzeVideo(){
      if(!video.src||!video.duration)return;
      stopRealtime();analyze.disabled=realtime.disabled=camera.disabled=true;save.disabled=true;save.textContent='保存结果';setProgress(0);setResultTone('分析中…');setStatus('准备视频分析…');
      try{
        const d=await getDetector(),fps=15,total=Math.max(1,Math.ceil(video.duration*fps)),canvas=document.createElement('canvas'),ratio=video.videoWidth/video.videoHeight||1;
        if(ratio>=1){canvas.width=640;canvas.height=Math.round(640/ratio);}else{canvas.height=640;canvas.width=Math.round(640*ratio);}
        const ctx=canvas.getContext('2d'),samples=[];
        for(let i=0;i<total;i++){await seekVideo(Math.min(video.duration-.001,i/fps));ctx.drawImage(video,0,0,canvas.width,canvas.height);const pose=(await d.estimatePoses(canvas,{flipHorizontal:false}))[0];samples.push({...extractSignal(pose,canvas.height),t:i/fps});setProgress((i+1)/total*100);setStatus(`分析中 ${Math.round((i+1)/total*100)}%…`);}
        const events=findJumps(samples,fps);setCount(events.length);updateResultMeta('视频分析');currentResult=makeResult(events.length,'视频分析');save.disabled=false;setStatus(`完成：检测到 ${events.length} 下`);
      }catch(err){console.error(err);setResultTone('失败');resultSub.textContent='模型或视频读取失败，请刷新后重试。';setStatus('分析失败');}
      finally{analyze.disabled=false;realtime.disabled=!video.src;camera.disabled=false;}
    }
    async function liveFrame(){
      if(!liveRunning||liveBusy)return;liveBusy=true;
      try{const pose=(await detector.estimatePoses(video,{flipHorizontal:false}))[0],sample={...extractSignal(pose,video.videoHeight||640),t:video.currentTime};liveSamples.push(sample);
        if(Number.isFinite(sample.y)){const tail=liveSamples.slice(-3).map(s=>s.y).filter(Number.isFinite),y=tail.reduce((a,b)=>a+b,0)/tail.length;liveSignal.push({y,t:sample.t});const event=detectLiveEvent(y,sample.t);if(event){liveEvents.push(event);liveCount++;setLiveCount(liveCount);updateLiveResult();}}
      }catch(err){console.error(err);setStatus('实时识别暂时失败');}finally{liveBusy=false;}
    }
    function liveLoop(now){if(!liveRunning)return;if(now-liveLastFrame>=66){liveLastFrame=now;liveFrame();}liveRaf=requestAnimationFrame(liveLoop);}
    function stopRealtime(ended=false){
      if(!liveRunning&&!cameraStream)return;
      liveRunning=false;cancelAnimationFrame(liveRaf);video.pause();
      if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;video.srcObject=null;video.controls=true;}
      liveBanner.hidden=true;realtime.textContent='实时播放';camera.textContent='摄像头';analyze.disabled=!video.src;realtime.disabled=!video.src;camera.disabled=false;
      if(liveSamples.length){updateLiveResult();save.disabled=false;}
      setStatus(ended?`实时播放完成：检测到 ${liveCount} 下`:'实时识别已停止');
    }
    async function startRealtime(){
      if(!video.src||!video.duration)return;if(liveRunning)return stopRealtime(false);
      analyze.disabled=realtime.disabled=camera.disabled=true;video.pause();setStatus('正在加载模型，完成后才开始播放…');
      try{await getDetector();}catch{analyze.disabled=realtime.disabled=camera.disabled=false;setStatus('模型加载失败，请检查网络');return;}
      liveMethod='实时播放';liveRunning=true;liveBusy=false;resetLiveState();resetResult();setCount(0);setResultTone('实时识别','live');liveBanner.hidden=false;realtime.disabled=false;camera.disabled=true;realtime.textContent='停止计数';
      await seekVideo(0);await liveFrame();await video.play();liveRaf=requestAnimationFrame(liveLoop);video.onended=()=>stopRealtime(true);
    }
    async function startCamera(){
      if(liveRunning)return stopRealtime(false);if(!navigator.mediaDevices?.getUserMedia)return setStatus('当前浏览器不支持摄像头');
      camera.disabled=true;setStatus('正在加载模型，完成后才打开摄像头…');
      try{
        await getDetector();cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
        video.removeAttribute('src');video.srcObject=cameraStream;video.controls=false;video.hidden=false;emptyStage.hidden=true;videoStage.classList.add('has-video');videoState.textContent='摄像头实时';await video.play();
        currentVideoKey=`camera:${makeId()}`;currentFile=null;liveMethod='摄像头';liveRunning=true;liveBusy=false;resetLiveState();resetResult();setCount(0);setResultTone('摄像头实时','live');liveBanner.hidden=false;camera.disabled=false;camera.textContent='停止计数';realtime.disabled=true;analyze.disabled=true;setStatus('摄像头实时识别中');liveRaf=requestAnimationFrame(liveLoop);
      }catch(err){console.error(err);camera.disabled=false;setStatus('无法打开摄像头，请检查权限');}
    }
    async function loadFile(file){
      if(!file||!file.type.startsWith('video/'))return;
      stopRealtime();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(file);video.srcObject=null;video.controls=true;video.src=objectUrl;video.hidden=false;emptyStage.hidden=true;videoStage.classList.add('has-video');resetResult();setProgress(0);setStatus('正在读取视频…');analyze.disabled=realtime.disabled=true;
      const key=await fileFingerprint(file);setVideoLoaded(file,key);
    }
    fileInput.addEventListener('change',e=>loadFile(e.target.files[0]));
    ['dragenter','dragover'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.add('drag');}));
    ['dragleave','drop'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.remove('drag');}));
    drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
    video.addEventListener('loadedmetadata',()=>{analyze.disabled=realtime.disabled=false;video.hidden=false;emptyStage.hidden=true;videoStage.classList.add('has-video');videoState.textContent=currentFile?.name||'视频已载入';setStatus('视频已载入，选择计数方式');});
    analyze.addEventListener('click',analyzeVideo);realtime.addEventListener('click',startRealtime);camera.addEventListener('click',startCamera);save.addEventListener('click',saveCurrentResult);
    function changeMonth(offset){visibleMonth=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()+offset,1);const day=Math.min(dateForKey(selectedDate).getDate(),new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()+1,0).getDate());selectedDate=localDateKey(new Date(visibleMonth.getFullYear(),visibleMonth.getMonth(),day));renderDailyLog();}
    $('prevMonth').addEventListener('click',()=>changeMonth(-1));
    $('nextMonth').addEventListener('click',()=>{if(!$('nextMonth').disabled)changeMonth(1);});
    calendarGrid.addEventListener('click',e=>{const day=e.target.closest('[data-date]');if(!day||day.disabled)return;selectedDate=day.dataset.date;renderDailyLog();});
    dayRecords.addEventListener('click',e=>{const button=e.target.closest('[data-delete-record]');if(!button)return;const next=records.filter(r=>!(r.videoId===button.dataset.deleteRecord&&recordDateKey(r)===selectedDate));if(!persistRecords(next)){setStatus('无法删除：浏览器存储空间不可用');return;}records=next;renderDailyLog();});
    plus.addEventListener('click',()=>{if(adjustedCount!==null){adjustedCount++;adjustedEl.value=adjustedCount;countEl.textContent=adjustedCount;}});
    minus.addEventListener('click',()=>{if(adjustedCount!==null){adjustedCount=Math.max(0,adjustedCount-1);adjustedEl.value=adjustedCount;countEl.textContent=adjustedCount;}});
    clear.addEventListener('click',()=>{stopRealtime();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=null;currentFile=null;currentVideoKey=null;video.removeAttribute('src');video.load();video.hidden=true;videoStage.classList.remove('has-video');emptyStage.hidden=false;videoState.textContent='未载入视频';resetResult();setProgress(0);setStatus('等待上传视频');fileInput.value='';});
    renderDailyLog();loadGitHubStars();
  </script>
