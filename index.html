<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>跳绳计数器</title>
  <style>
    :root { --canvas:#f5f5f7; --surface:#fff; --ink:#1d1d1f; --secondary:#6e6e73; --line:#d2d2d7; --blue:#0071e3; --blue-hover:#0077ed; --green:#34c759; --soft:#f2f2f7; --shadow:0 12px 34px rgba(0,0,0,.06); }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; color:var(--ink); background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    button,input,select { font:inherit; } button { cursor:pointer; } button:disabled { cursor:not-allowed; opacity:.45; }
    .shell { width:min(1060px,calc(100% - 40px)); margin:0 auto; padding:22px 0 42px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; height:38px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:650; letter-spacing:-.02em; }
    .brand-mark { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:#fff; background:var(--ink); font-size:15px; }
    .local-chip { display:inline-flex; align-items:center; gap:6px; color:var(--secondary); font-size:12px; }
    .local-chip i { width:7px; height:7px; border-radius:50%; background:var(--green); }
    .intro { padding:54px 0 26px; }
    .intro h1 { margin:0; font-size:clamp(32px,5vw,52px); line-height:1.08; letter-spacing:-.055em; font-weight:700; }
    .intro p { margin:12px 0 0; color:var(--secondary); font-size:16px; line-height:1.5; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr); align-items:start; gap:18px; }
    .panel { min-width:0; padding:22px; border:1px solid rgba(0,0,0,.05); border-radius:18px; background:var(--surface); box-shadow:var(--shadow); }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    h2 { margin:0; font-size:16px; line-height:1.2; letter-spacing:-.02em; }
    .panel-label,.record-summary { color:var(--secondary); font-size:12px; }
    .dropzone { display:block; padding:16px 17px; border:1px dashed #b8b8bd; border-radius:12px; color:var(--secondary); background:#fbfbfd; cursor:pointer; transition:.18s ease; }
    .dropzone:hover,.dropzone.drag { border-color:var(--blue); background:#f0f7ff; }
    .dropzone strong { display:block; color:var(--ink); font-size:14px; font-weight:600; }
    .dropzone span { display:block; margin-top:4px; font-size:12px; }
    input[type=file] { display:none; }
    .video-stage { min-height:330px; margin-top:14px; display:grid; place-items:center; overflow:hidden; border-radius:13px; background:#f2f2f7; position:relative; }
    .video-stage.has-video { background:#111; }
    video { display:block; width:100%; max-height:540px; object-fit:contain; background:#111; }
    .empty-stage { display:grid; place-items:center; gap:10px; color:var(--secondary); font-size:13px; }
    .empty-stage b { display:grid; place-items:center; width:42px; height:42px; border-radius:12px; color:var(--secondary); background:#e5e5ea; font-size:20px; font-weight:500; }
    .control-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .btn { min-height:40px; padding:0 15px; border:1px solid transparent; border-radius:9px; color:#fff; background:var(--blue); font-size:13px; font-weight:600; transition:background .15s ease,transform .15s ease; }
    .btn:hover:not(:disabled) { background:var(--blue-hover); transform:translateY(-1px); }
    .btn.secondary { color:var(--ink); border-color:var(--line); background:#fff; }
    .btn.secondary:hover:not(:disabled) { background:var(--soft); }
    .btn.ghost { color:var(--secondary); background:transparent; border-color:transparent; }
    .strategy-row { display:flex; align-items:center; gap:8px; margin-top:13px; color:var(--secondary); font-size:12px; }
    .strategy-row #status { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    select { min-height:34px; padding:0 26px 0 9px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:#fff; font-size:12px; }
    .progress-wrap { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--secondary); font-size:11px; }
    .progress { flex:1; height:4px; overflow:hidden; border-radius:999px; background:#e5e5ea; }
    .progress i { display:block; width:0; height:100%; border-radius:inherit; background:var(--blue); transition:width .2s; }
    .live-banner { display:flex; align-items:center; gap:8px; margin-top:12px; padding:9px 11px; border-radius:9px; color:#087b5b; background:#e6f7ed; font-size:12px; }
    .live-banner i { width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity:.35; transform:scale(.75); } }
    .result-panel { display:flex; flex-direction:column; align-self:start; }
    .result-state { display:inline-flex; align-items:center; padding:5px 8px; border-radius:999px; color:var(--secondary); background:var(--soft); font-size:11px; }
    .result-state[data-tone="live"] { color:#087b5b; background:#e6f7ed; }
    .result-state[data-tone="done"] { color:#8a5d13; background:#fff2d7; }
    .result-number { display:flex; align-items:baseline; gap:8px; padding:23px 0 13px; border-bottom:1px solid var(--line); }
    .result-number strong { font-size:clamp(78px,10vw,116px); line-height:.86; letter-spacing:-.09em; font-variant-numeric:tabular-nums; }
    .result-number span { color:var(--secondary); font-size:18px; }
    .result-sub { min-height:0; padding-top:12px; color:var(--secondary); font-size:12px; line-height:1.6; }
    .adjust { display:flex; align-items:center; gap:9px; margin-top:17px; padding-top:0; }
    .adjust button { width:38px; height:36px; padding:0; border:1px solid var(--line); border-radius:9px; color:var(--ink); background:#fff; font-size:20px; }
    .adjust button:hover:not(:disabled) { background:var(--soft); }
    .adjust output { min-width:42px; text-align:center; font-size:15px; font-variant-numeric:tabular-nums; }
    .result-actions { display:flex; gap:8px; margin-top:12px; }
    .result-actions .btn { width:100%; }
    .result-history { margin-top:23px; padding-top:17px; border-top:1px solid var(--line); }
    .history-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .history-head h3 { margin:0; font-size:13px; font-weight:600; letter-spacing:-.01em; }
    .records-empty { padding:8px 0 0; text-align:left; color:var(--secondary); font-size:12px; }
    .record-list { display:grid; gap:5px; margin-top:9px; }
    .record-list.is-collapsed .record-row:nth-child(n+4) { display:none; }
    .record-row { display:grid; grid-template-columns:54px minmax(0,1fr) auto; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:#fbfbfd; }
    .record-count { color:var(--blue); font-size:19px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.04em; }
    .record-count small { color:var(--secondary); font-size:11px; letter-spacing:0; }
    .record-main { min-width:0; }
    .record-title { overflow:hidden; color:var(--ink); font-size:12px; font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
    .record-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; color:var(--secondary); font-size:10px; }
    .record-tag { color:var(--blue); }
    .record-row .btn { min-height:27px; padding:0 8px; color:#c93434; background:#fff; border-color:#f0d2d2; font-size:10px; }
    .history-toggle { margin-top:8px; padding:0; border:0; color:var(--blue); background:transparent; font-size:11px; }
    .history-toggle:hover { text-decoration:underline; }
    .method-peek { position:relative; }
    .method-peek summary { list-style:none; cursor:pointer; }
    .method-peek summary::-webkit-details-marker { display:none; }
    .method-popover { position:absolute; top:37px; left:0; z-index:10; width:250px; padding:13px 14px; border:1px solid rgba(0,0,0,.07); border-radius:12px; background:rgba(255,255,255,.98); box-shadow:0 12px 30px rgba(0,0,0,.12); }
    .method-popover strong { display:block; font-size:12px; }
    .method-popover p { margin:6px 0 0; color:var(--secondary); font-size:11px; line-height:1.55; }
    footer { margin-top:20px; color:#98989d; text-align:center; font-size:11px; }
    @media (max-width:820px) { .intro { padding-top:38px; } .workspace { grid-template-columns:1fr; } .result-panel { min-height:0; } .adjust { margin-top:14px; } }
    @media (max-width:520px) { .shell { width:min(100% - 24px,1060px); padding-top:14px; } .intro { padding:34px 0 20px; } .intro h1 { font-size:34px; } .panel { padding:17px; border-radius:15px; } .control-row .btn { flex:1 1 46%; } .record-row { grid-template-columns:54px minmax(0,1fr); } .record-row>.btn { grid-column:2; justify-self:start; } .method-popover { width:220px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><details class="method-peek"><summary class="brand-mark" aria-label="查看计数原理" title="查看计数原理">↗</summary><div class="method-popover"><strong>计数原理</strong><p>识别双髋和双脚的上下运动；当上升、下降的幅度与间隔都达标，就记为 1 下。</p></div></details><div>跳绳计数器</div></div><div class="local-chip"><i></i> 仅在本机处理</div></header>
    <section class="intro"><h1>上传视频，开始计数</h1><p>选择一种方式，数清每一次跳跃。</p></section>
    <main>
      <div class="workspace">
        <section class="panel">
          <div class="panel-head"><h2>视频</h2><span class="panel-label" id="videoState">未载入视频</span></div>
          <label class="dropzone" id="drop" for="file"><strong>选择视频或拖到这里</strong><span>MP4 / MOV / WebM · 建议全身入镜</span><input id="file" type="file" accept="video/*" /></label>
          <div class="video-stage" id="videoStage"><video id="video" controls playsinline hidden></video><div class="empty-stage" id="emptyStage"><b>↗</b><span>还没有选择视频</span></div></div>
          <div class="control-row"><button class="btn" id="analyze" disabled>视频分析</button><button class="btn secondary" id="realtime" disabled>实时播放</button><button class="btn secondary" id="camera">摄像头</button><button class="btn ghost" id="clear">清空</button></div>
          <div class="strategy-row"><span>策略</span><select id="strategy"><option value="balanced">平衡 · 推荐</option><option value="sensitive">敏感 · 少漏计</option><option value="conservative">保守 · 少误计</option></select><span id="status">等待上传视频</span></div>
          <div class="progress-wrap"><div class="progress"><i id="progress"></i></div><span id="progressText">0%</span></div>
          <div class="live-banner" id="liveBanner" hidden><i></i><span>实时识别中 · 每确认一次起跳，计数增加 1</span></div>
        </section>
        <section class="panel result-panel">
          <div class="panel-head"><h2>计数</h2><span class="result-state" id="resultState">未开始</span></div>
          <div class="result-number"><strong id="count">—</strong><span>下</span></div>
          <div class="result-sub" id="resultSub">选择一种计数方式开始。</div>
          <div class="adjust"><button id="minus" disabled>−</button><output id="adjusted">—</output><button id="plus" disabled>＋</button><span class="panel-label">手动校正</span></div>
          <div class="result-actions"><button class="btn" id="save" disabled>保存结果</button></div>
          <div class="result-history" id="resultHistory" hidden><div class="history-head"><h3>历史记录</h3><span class="record-summary" id="recordSummary">载入视频后显示</span></div><div class="records-empty" id="recordsEmpty">选择视频后显示结果。</div><div class="record-list is-collapsed" id="recordsList"></div><button class="history-toggle" id="historyToggle" type="button" hidden></button></div>
        </section>
      </div>
    </main>
    <footer>本地处理 · 结果保存在当前设备</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  <script>
    const $ = id => document.getElementById(id); const fileInput = $('file'); const drop = $('drop'); const video = $('video'); const videoStage = $('videoStage'); const emptyStage = $('emptyStage'); const analyze = $('analyze'); const realtime = $('realtime'); const camera = $('camera'); const clear = $('clear'); const save = $('save'); const strategy = $('strategy'); const statusEl = $('status'); const videoState = $('videoState'); const resultState = $('resultState'); const resultSub = $('resultSub'); const progress = $('progress'); const progressText = $('progressText'); const liveBanner = $('liveBanner'); const countEl = $('count'); const adjustedEl = $('adjusted'); const plus = $('plus'); const minus = $('minus'); const resultHistory = $('resultHistory'); const recordsEmpty = $('recordsEmpty'); const recordsList = $('recordsList'); const historyToggle = $('historyToggle'); const recordSummary = $('recordSummary'); const storageKey = 'jump-counter-records-v3';
    let objectUrl = null; let detector = null; let currentFile = null; let currentVideoKey = null; let currentResult = null; let detectedCount = null; let adjustedCount = null; let cameraStream = null; let liveRunning = false; let liveRaf = 0; let liveBusy = false; let liveLastFrame = 0; let liveSamples = []; let liveSignal = []; let liveEvents = []; let liveCount = 0; let liveLastEventTime = -Infinity; let livePhase = 0; let livePrevY = NaN; let livePrevT = NaN; let liveCycleStartY = NaN; let liveTroughY = NaN; let liveMaxY = NaN; let historyExpanded = false; let records = loadRecords();
    const strategyConfig = { balanced:{label:'平衡',threshold:.10,minGap:.20}, sensitive:{label:'敏感',threshold:.07,minGap:.18}, conservative:{label:'保守',threshold:.16,minGap:.24} };
    function loadRecords() { try { return JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch { return []; } } function persistRecords() { localStorage.setItem(storageKey, JSON.stringify(records)); } function setStatus(text) { statusEl.textContent = text; } function setProgress(value) { const n = Math.max(0,Math.min(100,value)); progress.style.width = `${n}%`; progressText.textContent = `${Math.round(n)}%`; } function setResultTone(text,tone='') { resultState.textContent = text; resultState.dataset.tone = tone; } function setCount(n) { detectedCount = Math.max(0,Math.round(n)); adjustedCount = detectedCount; countEl.textContent = detectedCount; adjustedEl.value = adjustedCount; plus.disabled = minus.disabled = false; } function setLiveCount(n,events) { if (n < liveCount) return; liveCount = n; setCount(n); if (events) renderEventDots(events); } function keypoint(pose,name) { return pose?.keypoints?.find(k => k.name === name && (k.score ?? 1) > .25); } function percentile(values,p) { const a = values.filter(Number.isFinite).slice().sort((x,y) => x-y); if (!a.length) return NaN; return a[Math.min(a.length-1,Math.floor((a.length-1)*p))]; } function smooth(values,radius=1) { return values.map((_,i) => { const part = values.slice(Math.max(0,i-radius),Math.min(values.length,i+radius+1)).filter(Number.isFinite); return part.length ? part.reduce((a,b) => a+b,0)/part.length : NaN; }); }
    function extractSignal(pose,height) { const lh = keypoint(pose,'left_hip'); const rh = keypoint(pose,'right_hip'); if (!lh || !rh) return {y:NaN,confidence:0}; const hipY = (lh.y+rh.y)/2/height; const la = keypoint(pose,'left_ankle'); const ra = keypoint(pose,'right_ankle'); const feetVisible = la && ra; const y = feetVisible ? hipY*.82+((la.y+ra.y)/2/height)*.18 : hipY; const confidence = feetVisible ? Math.min(lh.score ?? 1,rh.score ?? 1,la.score ?? 1,ra.score ?? 1) : Math.min(lh.score ?? 1,rh.score ?? 1); return {y,confidence}; }
    function findJumps(samples,fps=15,mode=strategy.value) { const raw = samples.map(s => s.y); const valid = raw.filter(Number.isFinite); if (valid.length < 8) return []; const ys = smooth(raw,1); const config = strategyConfig[mode] || strategyConfig.balanced; const spread = percentile(valid,.90)-percentile(valid,.10); const prominence = Math.max(.004,Math.min(.025,spread*config.threshold)); const times = samples.map((s,i) => Number.isFinite(s.t) ? s.t : i/fps); const candidates = []; for (let i=2;i<ys.length-2;i++) { if (!Number.isFinite(ys[i]) || ys[i]>ys[i-1] || ys[i]>ys[i+1]) continue; if (ys[i] !== Math.min(...ys.slice(i-2,i+3))) continue; const left = Math.max(...ys.slice(Math.max(0,i-5),i)); const right = Math.max(...ys.slice(i+1,Math.min(ys.length,i+6))); if (Math.min(left,right)-ys[i] >= prominence) candidates.push(i); } const events = []; for (const i of candidates) { const previous = events[events.length-1]; if (!previous || times[i]-times[previous] >= config.minGap) events.push(i); else if (ys[i] < ys[previous]) events[events.length-1] = i; } return events.map(index => ({index,time:times[index]})); }
    function liveProminence() { const values = liveSignal.slice(-36).map(s => s.y).filter(Number.isFinite); if (values.length < 8) return .008; const spread = percentile(values,.90)-percentile(values,.10); const config = strategyConfig[strategy.value] || strategyConfig.balanced; return Math.max(.006,Math.min(.022,spread*config.threshold)); }
    function detectLiveEvent(y,t) { if (!Number.isFinite(y)) return null; if (!Number.isFinite(livePrevY)) { livePrevY=y; livePrevT=t; liveMaxY=y; return null; } const dy=y-livePrevY; const step=Math.max(.002,liveProminence()*.12); let event=null; if (dy < -step) { if (livePhase !== -1) { livePhase=-1; liveCycleStartY=Number.isFinite(liveMaxY)?liveMaxY:livePrevY; liveTroughY=y; } else liveTroughY=Math.min(liveTroughY,y); } else if (dy > step) { if (livePhase === -1) { const prominence=liveProminence(); const config=strategyConfig[strategy.value] || strategyConfig.balanced; const amplitude=liveCycleStartY-liveTroughY; const eventTime=livePrevT; if (amplitude >= prominence && eventTime-liveLastEventTime >= config.minGap) { liveLastEventTime=eventTime; event={time:eventTime}; } livePhase=1; liveMaxY=y; } else { livePhase=1; liveMaxY=Math.max(Number.isFinite(liveMaxY)?liveMaxY:y,y); } } else if (livePhase===1) { liveMaxY=Math.max(Number.isFinite(liveMaxY)?liveMaxY:y,y); } livePrevY=y; livePrevT=t; return event; }
    function updateLiveResult() { const modeLabel = video.src ? '实时视频' : '摄像头实时'; const quality = liveSamples.length ? liveSamples.filter(s => Number.isFinite(s.y)).length/liveSamples.length : 0; currentResult = makeResult(liveCount,modeLabel,strategyConfig[strategy.value].label,quality,liveEvents); updateResultMeta(modeLabel,quality,strategyConfig[strategy.value].label); }
    function resetLiveState() { liveSamples=[]; liveSignal=[]; liveEvents=[]; liveCount=0; liveLastEventTime=-Infinity; livePhase=0; livePrevY=NaN; livePrevT=NaN; liveCycleStartY=NaN; liveTroughY=NaN; liveMaxY=NaN; liveLastFrame=0; }
    function renderEventDots() { /* 主界面只显示结果；事件明细留在记录数据中。 */ } function formatDate(iso) { return new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)); } function escapeHtml(text) { return String(text).replace(/[&<>'"]/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function renderRecords() { const scoped = currentVideoKey ? records.filter(r => r.videoKey === currentVideoKey).sort((a,b) => b.createdAt.localeCompare(a.createdAt)) : []; resultHistory.hidden = !currentVideoKey; recordSummary.textContent = currentVideoKey ? `${scoped.length} 次已保存` : '载入视频后显示'; recordsEmpty.textContent = currentVideoKey ? '还没有保存的记录。完成一次计数后保存。' : '选择视频后显示结果。'; recordsEmpty.hidden = scoped.length > 0; recordsList.innerHTML = scoped.map(r => `<article class="record-row"><div class="record-count">${r.count}<small> 下</small></div><div class="record-main"><div class="record-title">${escapeHtml(r.fileName || '摄像头')}</div><div class="record-meta"><span class="record-tag">${escapeHtml(r.modeLabel)}</span><span>${escapeHtml(r.strategyLabel || '实时')}</span><span>${formatDate(r.createdAt)}</span></div></div><button class="btn danger" data-delete-record="${r.id}">删除</button></article>`).join(''); recordsList.classList.toggle('is-collapsed', !historyExpanded); historyToggle.hidden = scoped.length <= 3; historyToggle.textContent = historyExpanded ? '收起记录' : `查看全部 ${scoped.length} 条`; }
    function setVideoLoaded(file,key) { currentFile = file; currentVideoKey = key; historyExpanded = false; videoState.textContent = file.name; videoState.title = file.name; emptyStage.hidden = true; videoStage.classList.add('has-video'); renderRecords(); } async function fileFingerprint(file) { if (!crypto?.subtle) return `${file.name}:${file.size}:${file.lastModified}`; const digest = await crypto.subtle.digest('SHA-256',await file.arrayBuffer()); return `sha256:${Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('')}`; } function resetResult() { currentResult = null; detectedCount = adjustedCount = null; countEl.textContent = '—'; adjustedEl.value = '—'; plus.disabled = minus.disabled = true; save.disabled = true; save.textContent = '保存本次记录'; setResultTone('未开始'); resultSub.textContent = '选择一种计数方式开始。'; } function updateResultMeta(modeLabel,quality,strategyLabel) { setResultTone(modeLabel,modeLabel.includes('实时') ? 'live' : 'done'); resultSub.textContent = `${strategyLabel ? `${strategyLabel} · ` : ''}识别覆盖率 ${Math.round(quality*100)}% · 可用 ± 手动校正`; } function seekVideo(time) { return new Promise(resolve => { if (Math.abs(video.currentTime-time)<.001) return resolve(); const done = () => { video.removeEventListener('seeked',done); resolve(); }; video.addEventListener('seeked',done); video.currentTime = time; }); }
    async function getDetector() { if (detector) return detector; setStatus('正在加载模型…'); await tf.ready(); detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,enableSmoothing:false}); return detector; } function makeResult(count,modeLabel,strategyLabel,quality,events=[]) { return {count,modeLabel,strategyLabel,quality,events,fileName:currentFile?.name || '摄像头',videoKey:currentVideoKey || 'camera',createdAt:new Date().toISOString(),id:crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`}; } function saveCurrentResult() { if (!currentResult || detectedCount===null) return; records.push({...currentResult,count:adjustedCount}); persistRecords(); renderRecords(); save.disabled = true; save.textContent = '已保存本次记录'; setStatus('记录已保存，可继续用其他方式计数'); }
    async function analyzeVideo() { if (!video.src || !video.duration) return; stopRealtime(); analyze.disabled = realtime.disabled = camera.disabled = true; save.disabled = true; save.textContent = '保存本次记录'; setProgress(0); setResultTone('分析中…'); setStatus('准备视频分析…'); try { const d = await getDetector(); const fps=15; const total=Math.max(1,Math.ceil(video.duration*fps)); const canvas=document.createElement('canvas'); const ratio=video.videoWidth/video.videoHeight||1; if (ratio>=1) { canvas.width=640; canvas.height=Math.round(640/ratio); } else { canvas.height=640; canvas.width=Math.round(640*ratio); } const ctx=canvas.getContext('2d'); const samples=[]; for (let i=0;i<total;i++) { await seekVideo(Math.min(video.duration-.001,i/fps)); ctx.drawImage(video,0,0,canvas.width,canvas.height); const pose=(await d.estimatePoses(canvas,{flipHorizontal:false}))[0]; samples.push({...extractSignal(pose,canvas.height),t:i/fps}); setProgress((i+1)/total*100); setStatus(`分析中 ${Math.round((i+1)/total*100)}%…`); } const events=findJumps(samples,fps,strategy.value); const quality=samples.filter(s => Number.isFinite(s.y)).length/samples.length; setCount(events.length); updateResultMeta('视频分析',quality,strategyConfig[strategy.value].label); currentResult=makeResult(events.length,'视频分析',strategyConfig[strategy.value].label,quality,events); save.disabled=false; setStatus(`完成：检测到 ${events.length} 下`); } catch(err) { console.error(err); setResultTone('失败'); resultSub.textContent='模型或视频读取失败，请刷新后重试。'; setStatus('分析失败'); } finally { analyze.disabled=false; realtime.disabled=!video.src; camera.disabled=false; } }
    async function liveFrame() { if (!liveRunning || liveBusy) return; liveBusy=true; try { const pose=(await detector.estimatePoses(video,{flipHorizontal:false}))[0]; const sample={...extractSignal(pose,video.videoHeight||640),t:video.currentTime}; liveSamples.push(sample); if (Number.isFinite(sample.y)) { const tail=liveSamples.slice(-3).map(s => s.y).filter(Number.isFinite); const y=tail.reduce((a,b) => a+b,0)/tail.length; liveSignal.push({y,t:sample.t}); const event=detectLiveEvent(y,sample.t); if (event) { liveEvents.push(event); liveCount++; setLiveCount(liveCount,liveEvents); updateLiveResult(); } } } catch(err) { console.error(err); setStatus('实时识别暂时失败'); } finally { liveBusy=false; } }
    function liveLoop(now) { if (!liveRunning) return; if (now-liveLastFrame>=66) { liveLastFrame=now; liveFrame(); } liveRaf=requestAnimationFrame(liveLoop); }
    function stopRealtime(ended=false) { if (!liveRunning&&!cameraStream) return; liveRunning=false; cancelAnimationFrame(liveRaf); video.pause(); if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream=null; video.srcObject=null; video.controls=true; } liveBanner.hidden=true; realtime.textContent='实时播放计数'; camera.textContent='摄像头实时计数'; analyze.disabled=!video.src; realtime.disabled=!video.src; camera.disabled=false; if (liveSamples.length) { updateLiveResult(); save.disabled=false; } setStatus(ended?`实时播放完成：检测到 ${liveCount} 下`:'实时识别已停止'); }
    async function startRealtime() { if (!video.src||!video.duration) return; if (liveRunning) return stopRealtime(false); analyze.disabled=realtime.disabled=camera.disabled=true; video.pause(); setStatus('正在加载模型，完成后才开始播放…'); try { await getDetector(); } catch { analyze.disabled=realtime.disabled=camera.disabled=false; setStatus('模型加载失败，请检查网络'); return; } liveRunning=true; liveBusy=false; resetLiveState(); resetResult(); setResultTone('实时识别','live'); liveBanner.hidden=false; realtime.disabled=false; camera.disabled=true; realtime.textContent='停止实时计数'; await seekVideo(0); await liveFrame(); await video.play(); liveRaf=requestAnimationFrame(liveLoop); video.onended=() => stopRealtime(true); }
    async function startCamera() { if (liveRunning) return stopRealtime(false); if (!navigator.mediaDevices?.getUserMedia) return setStatus('当前浏览器不支持摄像头'); camera.disabled=true; setStatus('正在加载模型，完成后才打开摄像头…'); try { await getDetector(); cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}); video.removeAttribute('src'); video.srcObject=cameraStream; video.controls=false; video.hidden=false; emptyStage.hidden=true; videoStage.classList.add('has-video'); await video.play(); currentVideoKey='camera-session'; currentFile=null; historyExpanded = false; renderRecords(); liveRunning=true; liveBusy=false; resetLiveState(); resetResult(); setResultTone('摄像头实时','live'); liveBanner.hidden=false; camera.disabled=false; camera.textContent='停止摄像头计数'; realtime.disabled=true; analyze.disabled=true; setStatus('摄像头实时识别中'); liveRaf=requestAnimationFrame(liveLoop); } catch(err) { console.error(err); camera.disabled=false; setStatus('无法打开摄像头，请检查权限'); } }
    async function loadFile(file) { if (!file||!file.type.startsWith('video/')) return; stopRealtime(); if (objectUrl) URL.revokeObjectURL(objectUrl); objectUrl=URL.createObjectURL(file); video.srcObject=null; video.controls=true; video.src=objectUrl; video.hidden=false; emptyStage.hidden=true; videoStage.classList.add('has-video'); resetResult(); setProgress(0); setStatus('正在读取视频…'); analyze.disabled=realtime.disabled=true; const key=await fileFingerprint(file); setVideoLoaded(file,key); }
    fileInput.addEventListener('change',e => loadFile(e.target.files[0])); ['dragenter','dragover'].forEach(type => drop.addEventListener(type,e => { e.preventDefault(); drop.classList.add('drag'); })); ['dragleave','drop'].forEach(type => drop.addEventListener(type,e => { e.preventDefault(); drop.classList.remove('drag'); })); drop.addEventListener('drop',e => loadFile(e.dataTransfer.files[0])); video.addEventListener('loadedmetadata',() => { analyze.disabled=realtime.disabled=false; video.hidden=false; emptyStage.hidden=true; videoStage.classList.add('has-video'); videoState.textContent=currentFile?.name||'视频已载入'; setStatus('视频已载入，选择计数方式'); }); analyze.addEventListener('click',() => analyzeVideo()); realtime.addEventListener('click',startRealtime); camera.addEventListener('click',startCamera); save.addEventListener('click',saveCurrentResult); historyToggle.addEventListener('click',() => { historyExpanded = !historyExpanded; renderRecords(); }); plus.addEventListener('click',() => { if (adjustedCount!==null) { adjustedCount++; adjustedEl.value=adjustedCount; countEl.textContent=adjustedCount; } }); minus.addEventListener('click',() => { if (adjustedCount!==null) { adjustedCount=Math.max(0,adjustedCount-1); adjustedEl.value=adjustedCount; countEl.textContent=adjustedCount; } }); recordsList.addEventListener('click',e => { const id=e.target.dataset.deleteRecord; if (!id) return; records=records.filter(r => r.id!==id); persistRecords(); renderRecords(); }); clear.addEventListener('click',() => { stopRealtime(); if (objectUrl) URL.revokeObjectURL(objectUrl); objectUrl=null; currentFile=null; currentVideoKey=null; historyExpanded=false; video.removeAttribute('src'); video.load(); video.hidden=true; videoStage.classList.remove('has-video'); emptyStage.hidden=false; videoState.textContent='未载入视频'; resetResult(); renderRecords(); setProgress(0); setStatus('等待上传视频'); fileInput.value=''; }); renderRecords();
  </script>
